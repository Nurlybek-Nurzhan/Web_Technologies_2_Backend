groups:
  - name: fitclub_alerts
    rules:
      - alert: HighErrorRate
        expr: rate(http_requests_total{status=~"5.."}[5m]) > 0.05
        for: 1m
        labels:
          severity: warning
        annotations:
          summary: "High HTTP 5xx error rate on FitClub backend"
          description: "More than 5% of requests are returning 5xx errors for over 1 minute."

      - alert: BackendDown
        expr: up{job="backend"} == 0
        for: 30s
        labels:
          severity: critical
        annotations:
          summary: "FitClub backend is DOWN"
          description: "The backend service has been unreachable for more than 30 seconds."
